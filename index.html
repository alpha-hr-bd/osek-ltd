<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>OSEK LTD</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<header class="topbar">

    <div class="brand">

        <div class="logo">O</div>

        <div>
            <h1>OSEK LTD</h1>
            <span>Live Database</span>
        </div>

    </div>

    <a
        href="admin.html"
        class="admin-link"
    >
        Admin
    </a>

</header>


<main class="container">

    <section class="hero">

        <p class="eyebrow">
            OSEK LTD
        </p>

        <h2>
            Live Reports
        </h2>

        <p>
            Real-time reports powered by Firebase.
        </p>

    </section>


    <section class="stats">

        <div class="stat-card">
            <span>Total Reports</span>
            <strong id="totalReports">0</strong>
        </div>

        <div class="stat-card">
            <span>Today</span>
            <strong id="todayReports">0</strong>
        </div>

        <div class="stat-card">
            <span>Status</span>
            <strong class="online">
                LIVE
            </strong>
        </div>

    </section>


    <section class="panel">

        <div class="panel-header">

            <div>
                <h3>Live Reports</h3>
                <p>
                    Updates automatically.
                </p>
            </div>

        </div>

        <div
            id="reports"
            class="reports"
        >
            Loading...
        </div>

    </section>

</main>


<footer>
    © 2026 OSEK LTD
</footer>


<script type="module">

import {
    listenToReports
} from "./script.js";


const reports =
    document.getElementById("reports");

const total =
    document.getElementById("totalReports");

const today =
    document.getElementById("todayReports");


listenToReports(data => {

    total.textContent = data.length;

    const todayDate =
        new Date().toDateString();

    today.textContent =
        data.filter(item =>
            item.createdAt &&
            new Date(
                item.createdAt
            ).toDateString() === todayDate
        ).length;


    if (!data.length) {

        reports.innerHTML = `
            <div class="empty">
                <div>📊</div>
                <h3>No reports</h3>
                <p>No report has been published yet.</p>
            </div>
        `;

        return;
    }


    reports.innerHTML =
        data.map(item => `

            <article class="report-card">

                <div class="report-head">

                    <div>
                        <h3>
                            ${safe(item.title)}
                        </h3>

                        <small>
                            ${format(item.updatedAt)}
                        </small>
                    </div>

                    <span class="badge">
                        ${safe(item.status)}
                    </span>

                </div>

                <p>
                    ${safe(item.description)}
                </p>

            </article>

        `).join("");

});


function safe(value) {

    return String(value || "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}


function format(time) {

    if (!time)
        return "Unknown";

    return new Date(time)
        .toLocaleString("en-BD");

}

</script>

</body>
</html>
